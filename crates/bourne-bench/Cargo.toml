[package]
name = "bourne-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Benchmarks and profiling harness for bourne. Not published."
publish = false

[dependencies]
bourne-core = { path = "../bourne-core" }
bourne = { path = "../bourne" }
bourne-alloctest = { path = "../bourne-alloctest", optional = true }
dhat = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
iai-callgrind = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Float-formatting comparison point. Used only by the `floats` bench
# to measure how much we'd gain from porting ryu inline vs the current
# `write!`-based path. NOT a library dep.
ryu = "1"

[features]
default = []
# Enables the heap-profiling example. Build/run with:
#   cargo run --release --features dhat-heap --example profile_heap
dhat-heap = ["dep:dhat"]
# Enables the memory-comparison binary that puts bourne and serde_json
# through a counting allocator and prints a side-by-side report. Build/run:
#   cargo run --release --features compare-mem --bin compare_mem
compare-mem = ["dep:bourne-alloctest", "dep:serde", "dep:serde_json"]
# Enables the perf-friendly profiling binary. Builds a long-running
# tight loop suitable for `perf record` / flamegraph capture. See
# PROFILING.md for the runbook.
profile = []

[[example]]
name = "profile_heap"
required-features = ["dhat-heap"]

[[bin]]
name = "compare_mem"
required-features = ["compare-mem"]

[[bin]]
name = "profile"
required-features = ["profile"]

[[bench]]
name = "iai"
harness = false

[[bench]]
name = "stream"
harness = false

[[bench]]
name = "typed"
harness = false

[[bench]]
name = "shapes"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "pathological"
harness = false

[[bench]]
name = "realistic"
harness = false

[[bench]]
name = "malformed"
harness = false

[[bench]]
name = "compare_features"
harness = false

[[bench]]
name = "floats"
harness = false

[lints]
workspace = true
