[workspace]
resolver = "3"
members = ["crates/bourne-core", "crates/bourne", "crates/bourne-bench", "crates/bourne-alloctest"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/illuminodes/bourne"
rust-version = "1.85"

[workspace.lints.rust]
# `deny` (overridable), not `forbid`. The bourne-alloctest harness needs
# to implement GlobalAlloc, which is fundamentally unsafe; that crate
# `#![allow(unsafe_code)]` at its crate root. Every other crate stays clean.
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Custom profile inheriting from release. Used by the perf-driven `profile`
# binary in bourne-bench. Keeps debug symbols and frame pointers on so
# `perf record -g` and flamegraphs name actual functions instead of addresses,
# without polluting the standard `release` profile downstream users get.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
# Frame pointers can't currently be set per-profile in stable Cargo — set
# them via RUSTFLAGS in the runbook (see PROFILING.md).

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# Module-name repetition is intentional: `bourne::FromJson`, `JsonStr`,
# `JsonNum` are correct names. The alternative ("From", "Str", "Num") would
# clash with core types or be uselessly generic.
module_name_repetitions = "allow"

# Every FromJson::from_json impl returns Result. A blanket "errors when parse
# fails" doc on each one is noise; the Error type itself documents its
# variants via ErrorKind.
missing_errors_doc = "allow"

# `match { None => …, Some(_) => … }` is often clearer as a match than as
# `if let … else …`, especially when surrounding code is also matching on
# the same value.
single_match_else = "allow"
