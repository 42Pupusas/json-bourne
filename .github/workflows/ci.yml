name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-features` turns on both of bourne-bench's allocator-installing
      # features; the workspace pins those behind explicit feature lists in
      # ci.yml instead (see scripts/ci.sh, which runs this exact list).
      - run: scripts/ci.sh test

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci.sh msrv

  no_std:
    name: no_std build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # json-bourne is no_std-first: the streaming lexer/parser is no_std
      # always; alloc-gated impls need `--features alloc`. Verify both
      # build cleanly against bare-metal targets.
      - run: cargo build -p json-bourne --no-default-features --target ${{ matrix.target }}
      - run: cargo build -p json-bourne --no-default-features --features alloc --target ${{ matrix.target }}

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Tight on the published crates; benches/profiling crates carry
      # cast/precision-loss warnings that are inherent to bench code.
      - run: cargo clippy -p json-bourne -p bourne-derive --all-targets --all-features -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  crap:
    # CRAP gate (audit F4): cargo-crappy instruments the suite itself and
    # scores complexity × miss-coverage × idiom penalties. Threshold 21;
    # bench fixtures excluded. `#[allow(unknown_lints, crappy)]` on a
    # function documents a suppression at the source.
    name: crap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-crappy --locked
      - run: scripts/ci.sh crap

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      # SSE2 intrinsics are unsupported under miri; disable them via cfg.
      MIRIFLAGS: "-Zmiri-disable-isolation"
      RUSTFLAGS: "--cfg bourne_no_simd"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Skip the conformance test (file IO) and proptest (slow under miri);
      # cover the parsing core + alloc impls.
      - run: cargo miri test -p json-bourne --lib

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [stream, typed, derived]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -runs=10000
